<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rocío Estrella · Asistente Virtual</title>
    <meta
      name="description"
      content="Tarjeta digital de Rocío Estrella, Asistente Virtual."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Cpath d='M17 42c9-17 21-17 30 0' fill='none' stroke='%23d8b86a' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='24' r='7' fill='%23f4ead0'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #080808;
        --panel: #111111;
        --panel-2: #171717;
        --line: rgba(216, 184, 106, 0.24);
        --line-soft: rgba(255, 255, 255, 0.1);
        --gold: #d8b86a;
        --gold-soft: #f4ead0;
        --text: #fffaf0;
        --muted: #b7b0a4;
        --shadow: rgba(216, 184, 106, 0.2);
        --radius: 28px;
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 50% -12%, rgba(216, 184, 106, 0.17), transparent 36rem),
          linear-gradient(180deg, #050505 0%, #101010 48%, #070707 100%);
        color: var(--text);
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, black, transparent 72%);
      }

      a,
      button {
        -webkit-tap-highlight-color: transparent;
      }

      .page {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px 14px;
      }

      .card {
        position: relative;
        width: min(100%, 430px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.065), transparent 34%),
          linear-gradient(180deg, rgba(23, 23, 23, 0.98), rgba(8, 8, 8, 0.98));
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.58), 0 0 34px var(--shadow);
        animation: rise 520ms ease both;
      }

      .card::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        border-radius: inherit;
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.12);
      }

      .inner {
        position: relative;
        z-index: 1;
        padding: 26px 20px 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
      }

      .brand-logo {
        display: block;
        width: 104px;
        height: auto;
        border: 1px solid rgba(216, 184, 106, 0.24);
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.34), 0 0 24px rgba(216, 184, 106, 0.12);
      }

      .portrait-wrap {
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
      }

      .portrait {
        width: 142px;
        aspect-ratio: 1;
        overflow: hidden;
        border: 2px solid rgba(216, 184, 106, 0.54);
        border-radius: 50%;
        background: #1d1d1d;
        box-shadow: 0 0 0 8px rgba(216, 184, 106, 0.055), 0 12px 28px rgba(0, 0, 0, 0.36);
      }

      .portrait img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .intro {
        text-align: center;
      }

      .wordmark-logo {
        display: block;
        width: min(100%, 330px);
        height: auto;
        margin: 0 auto;
        mix-blend-mode: screen;
      }

      h1 {
        margin: 0;
        color: var(--gold);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 9vw, 2.65rem);
        font-weight: 500;
        line-height: 1.02;
      }

      .role {
        margin: 9px 0 0;
        color: var(--gold-soft);
        font-size: 1rem;
        font-weight: 700;
      }

      .bio {
        max-width: 24rem;
        margin: 13px auto 0;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.55;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 24px;
      }

      .button {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--line-soft);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.055);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 0.91rem;
        font-weight: 750;
        text-decoration: none;
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .button svg {
        width: 18px;
        height: 18px;
        color: var(--gold);
        flex: 0 0 auto;
      }

      .button:hover,
      .button:focus-visible {
        border-color: rgba(216, 184, 106, 0.5);
        background: rgba(216, 184, 106, 0.09);
        outline: none;
        transform: translateY(-1px);
      }

      .button:active {
        transform: translateY(1px) scale(0.99);
      }

      .cta {
        width: 100%;
        min-height: 56px;
        margin-top: 12px;
        border-color: rgba(216, 184, 106, 0.62);
        background: linear-gradient(135deg, #e8cc80, #b7923e);
        color: #171104;
        box-shadow: 0 12px 30px rgba(216, 184, 106, 0.2);
      }

      .cta svg {
        color: #171104;
      }

      .utility {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }

      .section {
        margin-top: 24px;
        padding-top: 22px;
        border-top: 1px solid var(--line-soft);
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      h2 {
        margin: 0;
        color: var(--gold-soft);
        font-size: 1.05rem;
        line-height: 1.25;
      }

      .divider {
        height: 1px;
        flex: 1;
        background: linear-gradient(90deg, rgba(216, 184, 106, 0.42), transparent);
      }

      .services {
        display: grid;
        gap: 10px;
      }

      .service {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 12px;
        align-items: start;
        padding: 14px;
        border: 1px solid var(--line-soft);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.045);
      }

      .service-icon {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid rgba(216, 184, 106, 0.36);
        border-radius: 14px;
        background: rgba(216, 184, 106, 0.08);
        color: var(--gold);
      }

      .service-icon svg {
        width: 21px;
        height: 21px;
      }

      .service h3 {
        margin: 0;
        color: var(--text);
        font-size: 0.96rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .service p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.45;
      }

      .share-box {
        display: grid;
        justify-items: center;
        gap: 14px;
        padding: 16px;
        border: 1px solid var(--line-soft);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.045);
      }

      .qr-frame {
        display: grid;
        width: min(100%, 210px);
        aspect-ratio: 1;
        place-items: center;
        border-radius: 18px;
        background: #ffffff;
        padding: 12px;
      }

      .qr-frame img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .download {
        width: 100%;
      }

      .footer {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line-soft);
        color: rgba(244, 234, 208, 0.7);
        font-size: 0.82rem;
        text-align: center;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 10;
        max-width: calc(100vw - 32px);
        padding: 12px 14px;
        border: 1px solid rgba(216, 184, 106, 0.35);
        border-radius: 14px;
        background: rgba(17, 17, 17, 0.95);
        color: var(--gold-soft);
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 180ms ease, transform 180ms ease;
        visibility: hidden;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 374px) {
        .inner {
          padding-inline: 16px;
        }

        .actions,
        .utility {
          gap: 8px;
        }

        .button {
          min-height: 50px;
          font-size: 0.84rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <article class="card" aria-label="Tarjeta digital de Rocío Estrella">
        <div class="inner">
          <header>
            <div class="brand">
              <img
                class="brand-logo"
                src="Captura%20de%20pantalla%202026-10-08%20a%20las%209.27.51.png"
                alt="Rocío Estrella Asistente Online"
              />
            </div>

            <div class="portrait-wrap">
              <div class="portrait">
                <img
                  src="WhatsApp%20Image%202026-09-28%20at%2012.41.58%20(1).jpeg"
                  alt="Rocío Estrella"
                />
              </div>
            </div>

            <div class="intro">
              <img
                class="wordmark-logo"
                src="Captura%20de%20pantalla%202026-10-08%20a%20las%209.33.33.png"
                alt="Rocío Estrella Asistente Online"
              />
              <p class="bio" id="profile-bio">
                Apoyo profesional para gestionar clientes, ventas y organización de tu negocio.
              </p>
            </div>
          </header>

          <nav class="actions" aria-label="Acciones principales">
            <a class="button" id="whatsapp-link" href="#" rel="noopener">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21l1.65-4.8A8.5 8.5 0 1 1 8 19.35L3 21Z"/><path d="M9.5 9.5c.35 2.2 2.8 4.65 5 5l1.35-1.35c.22-.22.55-.3.84-.19.92.33 1.9.5 2.91.5"/></svg>
              WhatsApp
            </a>
            <a class="button" id="phone-link" href="#">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.63 2.6a2 2 0 0 1-.45 2.11L8 9.71a16 16 0 0 0 6.29 6.29l1.28-1.28a2 2 0 0 1 2.11-.45c.83.3 1.7.51 2.6.63A2 2 0 0 1 22 16.92Z"/></svg>
              Llamar
            </a>
            <a class="button" id="email-link" href="#">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>
              Email
            </a>
          </nav>

          <a class="button cta" href="#servicios">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><path d="M18 9 12 3 6 9"/></svg>
            Ver servicios
          </a>

          <div class="utility" aria-label="Acciones de tarjeta">
            <button class="button" id="save-contact" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-8 0v2"/><circle cx="12" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
              Guardar contacto
            </button>
            <button class="button" id="share-card" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98"/><path d="m15.41 6.51-6.82 3.98"/></svg>
              Compartir tarjeta
            </button>
          </div>

          <section class="section" id="servicios" aria-labelledby="services-title">
            <div class="section-title">
              <h2 id="services-title">Servicios</h2>
              <span class="divider" aria-hidden="true"></span>
            </div>
            <div class="services" id="services-list"></div>
          </section>

          <section class="section" aria-labelledby="share-title">
            <div class="section-title">
              <h2 id="share-title">Compartir mi tarjeta</h2>
              <span class="divider" aria-hidden="true"></span>
            </div>
            <div class="share-box">
              <div class="qr-frame">
                <img id="qr-code" alt="Código QR de la tarjeta de Rocío Estrella" />
              </div>
              <a class="button download" id="download-qr" href="#" download="qr-rocio-estrella.png">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                Descargar QR
              </a>
            </div>
          </section>

          <footer class="footer">Rocío Estrella · Asistente Virtual</footer>
        </div>
      </article>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const profile = {
        name: "Rocío Estrella",
        role: "Asistente Virtual",
        brand: "Rocío Estrella",
        phoneDisplay: "+34 623 410 661",
        phone: "+34623410661",
        whatsapp: "34623410661",
        email: "rocioestrellavirtualoffice@gmail.com",
        bio: "Apoyo profesional para gestionar clientes, ventas y organización de tu negocio.",
        services: [
          {
            icon: "target",
            name: "Closer de ventas",
            description:
              "Apoyo en conversaciones comerciales, seguimiento de oportunidades y cierre de ventas.",
          },
          {
            icon: "message",
            name: "Atención al cliente",
            description:
              "Gestión profesional de consultas, seguimiento y comunicación con clientes.",
          },
          {
            icon: "calendar",
            name: "Gestión de eventos",
            description:
              "Apoyo en organización, coordinación y seguimiento de eventos.",
          },
        ],
      };

      const icons = {
        target:
          '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg>',
        message:
          '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/></svg>',
        calendar:
          '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></svg>',
      };

      const publicUrl = new URL(window.location.href);
      publicUrl.hash = "";
      const cardUrl = publicUrl.href;

      const whatsappLink = document.querySelector("#whatsapp-link");
      const phoneLink = document.querySelector("#phone-link");
      const emailLink = document.querySelector("#email-link");
      const servicesList = document.querySelector("#services-list");
      const qrCode = document.querySelector("#qr-code");
      const downloadQr = document.querySelector("#download-qr");
      const toast = document.querySelector("#toast");

      whatsappLink.href = `https://wa.me/${profile.whatsapp}`;
      phoneLink.href = `tel:${profile.phone}`;
      emailLink.href = `mailto:${profile.email}`;

      servicesList.innerHTML = profile.services
        .map(
          (service) => `
            <article class="service">
              <span class="service-icon">${icons[service.icon]}</span>
              <div>
                <h3>${service.name}</h3>
                <p>${service.description}</p>
              </div>
            </article>
          `,
        )
        .join("");

      const qrApi =
        "https://api.qrserver.com/v1/create-qr-code/?size=720x720&margin=18&color=111111&bgcolor=FFFFFF&data=" +
        encodeURIComponent(cardUrl);
      qrCode.src = qrApi;
      downloadQr.href = qrApi;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => {
          toast.classList.remove("is-visible");
        }, 2200);
      }

      function downloadFile(filename, content, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 500);
      }

      function createVCard() {
        return [
          "BEGIN:VCARD",
          "VERSION:3.0",
          "N:Estrella;Rocío;;;",
          "FN:Rocío Estrella",
          "TITLE:Asistente Virtual",
          `TEL;TYPE=CELL:${profile.phone}`,
          `EMAIL;TYPE=INTERNET:${profile.email}`,
          `URL:${cardUrl}`,
          "END:VCARD",
        ].join("\r\n");
      }

      document.querySelector("#save-contact").addEventListener("click", () => {
        downloadFile("rocio-estrella.vcf", createVCard(), "text/vcard;charset=utf-8");
        showToast("Contacto listo para guardar");
      });

      document.querySelector("#share-card").addEventListener("click", async () => {
        const shareData = {
          title: `${profile.name} · ${profile.role}`,
          text: profile.bio,
          url: cardUrl,
        };

        try {
          if (navigator.share) {
            await navigator.share(shareData);
            return;
          }

          await navigator.clipboard.writeText(cardUrl);
          showToast("Enlace copiado");
        } catch (error) {
          if (error.name !== "AbortError") {
            showToast("No se pudo compartir");
          }
        }
      });
    </script>
  </body>
</html>
