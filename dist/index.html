    <style>
      :root {
        --bg: #080808;
        --panel: #111111;
        --panel-2: #171717;
        --line: rgba(216, 184, 106, 0.24);
        --line-soft: rgba(255, 255, 255, 0.1);
        --gold: #d8b86a;
        --gold-soft: #f4ead0;
        --text: #fffaf0;
        --muted: #b7b0a4;
        --shadow: rgba(216, 184, 106, 0.2);
        --radius: 28px;
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 50% -12%, rgba(216, 184, 106, 0.17), transparent 36rem),
          linear-gradient(180deg, #050505 0%, #101010 48%, #070707 100%);
        color: var(--text);
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, black, transparent 72%);
      }

      a,
      button {
        -webkit-tap-highlight-color: transparent;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .page {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px 14px;
      }

      .card {
        position: relative;
        width: min(100%, 430px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.065), transparent 34%),
          linear-gradient(180deg, rgba(23, 23, 23, 0.98), rgba(8, 8, 8, 0.98));
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.58), 0 0 34px var(--shadow);
        animation: rise 520ms ease both;
      }

      .card::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        border-radius: inherit;
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.12);
      }

      .inner {
        position: relative;
        z-index: 1;
        padding: 26px 20px 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
      }

      .brand-logo {
        display: block;
        width: 112px;
        height: 112px;
        padding: 4px;
        object-fit: contain;
        object-position: center;
        border: 1px solid rgba(216, 184, 106, 0.24);
        border-radius: 50%;
        background: #090909;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.34), 0 0 24px rgba(216, 184, 106, 0.12);
      }

      .portrait-wrap {
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
      }

      .portrait {
        width: 142px;
        aspect-ratio: 1;
        overflow: hidden;
        border: 2px solid rgba(216, 184, 106, 0.54);
        border-radius: 50%;
        background: radial-gradient(circle at 50% 35%, rgba(216, 184, 106, 0.16), #111111 68%);
        box-shadow: 0 0 0 8px rgba(216, 184, 106, 0.055), 0 12px 28px rgba(0, 0, 0, 0.36);
      }

      .portrait img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 24%;
        transform: scale(1.06);
      }

      .intro {
        text-align: center;
      }

      .wordmark-logo {
        display: block;
        width: min(100%, 330px);
        height: auto;
        margin: 0 auto;
      }

      h1 {
        margin: 0;
        color: var(--gold);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 9vw, 2.65rem);
        font-weight: 500;
        line-height: 1.02;
      }

      .role {
        margin: 9px 0 0;
        color: var(--gold-soft);
        font-size: 1rem;
        font-weight: 700;
      }

      .bio {
        max-width: 24rem;
        margin: 13px auto 0;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.55;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 24px;
      }

      .button {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--line-soft);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.055);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 0.91rem;
        font-weight: 750;
        text-decoration: none;
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .button svg {
        width: 18px;
        height: 18px;
        color: var(--gold);
        flex: 0 0 auto;
      }

      #whatsapp-link .brand-icon {
        color: #25d366;
      }

      #phone-link .brand-icon {
        color: #32d76b;
      }

      .button:hover,
      .button:focus-visible {
        border-color: rgba(216, 184, 106, 0.5);
        background: rgba(216, 184, 106, 0.09);
        outline: none;
        transform: translateY(-1px);
      }

      .button:active {
        transform: translateY(1px) scale(0.99);
      }

      .cta {
        width: 100%;
        min-height: 56px;
        margin-top: 12px;
        border-color: rgba(216, 184, 106, 0.62);
        background: linear-gradient(135deg, #e8cc80, #b7923e);
        color: #171104;
        box-shadow: 0 12px 30px rgba(216, 184, 106, 0.2);
      }

      .cta svg {
        color: #171104;
      }

      #whatsapp-link {
        animation: whatsappPulse 1.9s ease-in-out infinite;
        border-color: rgba(216, 184, 106, 0.45);
      }

      .utility {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }

      .section {
        margin-top: 24px;
        padding-top: 22px;
        border-top: 1px solid var(--line-soft);
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      h2 {
        margin: 0;
        color: var(--gold-soft);
        font-size: 1.05rem;
        line-height: 1.25;
      }

      .divider {
        height: 1px;
        flex: 1;
        background: linear-gradient(90deg, rgba(216, 184, 106, 0.42), transparent);
      }

      .services {
        display: grid;
        gap: 10px;
      }

      .service {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 12px;
        align-items: start;
        padding: 14px;
        border: 1px solid var(--line-soft);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.045);
      }

      .service-icon {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid rgba(216, 184, 106, 0.36);
        border-radius: 14px;
        background: rgba(216, 184, 106, 0.08);
        color: var(--gold);
      }

      .service-icon svg {
        width: 21px;
        height: 21px;
      }

      .service h3 {
        margin: 0;
        color: var(--text);
        font-size: 0.96rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .service p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.45;
      }

      .share-box {
        display: grid;
        justify-items: center;
        gap: 14px;
        padding: 16px;
        border: 1px solid var(--line-soft);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.045);
      }

      .qr-frame {
        display: grid;
        width: min(100%, 210px);
        aspect-ratio: 1;
        place-items: center;
        border-radius: 18px;
        background: #ffffff;
        padding: 12px;
      }

      .qr-frame img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .download {
        width: 100%;
      }

      .footer {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line-soft);
        color: rgba(244, 234, 208, 0.7);
        font-size: 0.82rem;
        text-align: center;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 10;
        max-width: calc(100vw - 32px);
        padding: 12px 14px;
        border: 1px solid rgba(216, 184, 106, 0.35);
        border-radius: 14px;
        background: rgba(17, 17, 17, 0.95);
        color: var(--gold-soft);
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 180ms ease, transform 180ms ease;
        visibility: hidden;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes whatsappPulse {
        0%,
        100% {
          background: rgba(255, 255, 255, 0.055);
          box-shadow: 0 0 0 rgba(216, 184, 106, 0);
        }
        50% {
          background: rgba(216, 184, 106, 0.16);
          box-shadow: 0 0 18px rgba(216, 184, 106, 0.28);
        }
      }

      @media (max-width: 374px) {
        .inner {
          padding-inline: 16px;
        }

        .actions,
        .utility {
          gap: 8px;
        }

        .button {
          min-height: 50px;
          font-size: 0.84rem;
        }
      }
    </style>
  </head>

    <script>
      const profile = {
        name: "Rocío Estrella",
        role: "Asistente Virtual",
        brand: "Rocío Estrella",
        phoneDisplay: "+34 623 410 661",
        phone: "+34623410661",
        whatsapp: "34623410661",
        email: "rocioestrellavirtualoffice@gmail.com",
        bio: "Apoyo profesional para gestionar clientes, ventas y organización de tu negocio.",
        services: [
          {
            icon: "target",
            name: "Closer de ventas",
            description:
              "Conversaciones comerciales orientadas a convertir oportunidades en clientes.",
          },
          {
            icon: "message",
            name: "Atención al cliente",
            description:
              "Gestión de consultas y comunicación profesional para ofrecer una atención cercana y eficiente.",
          },
          {
            icon: "calendar",
            name: "Gestión de eventos",
            description:
              "Organización y coordinación para que cada detalle esté bajo control.",
          },
        ],
      };

      const icons = {
        target:
          '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg>',
        message:
          '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/></svg>',
        calendar:
          '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></svg>',
      };

      const publicUrl = new URL(window.location.href);
      publicUrl.hash = "";
      const cardUrl = publicUrl.href;

      const whatsappLink = document.querySelector("#whatsapp-link");
      const phoneLink = document.querySelector("#phone-link");
      const servicesList = document.querySelector("#services-list");
      const servicesToggle = document.querySelector("#services-toggle");
      const servicesToggleLabel = document.querySelector("#services-toggle-label");
      const servicesSection = document.querySelector("#servicios");
      const qrCode = document.querySelector("#qr-code");
      const downloadQr = document.querySelector("#download-qr");
      const toast = document.querySelector("#toast");

      whatsappLink.href = `https://wa.me/${profile.whatsapp}`;
      phoneLink.href = `tel:${profile.phone}`;

      servicesList.innerHTML = profile.services
        .map(
          (service) => `
            <article class="service">
              <span class="service-icon">${icons[service.icon]}</span>
              <div>
                <h3>${service.name}</h3>
                <p>${service.description}</p>
              </div>
            </article>
          `,
        )
        .join("");

      servicesToggle.addEventListener("click", () => {
        const isOpen = servicesToggle.getAttribute("aria-expanded") === "true";
        servicesToggle.setAttribute("aria-expanded", String(!isOpen));
        servicesSection.hidden = isOpen;
        servicesToggleLabel.textContent = isOpen ? "Ver servicios" : "Ocultar servicios";

        if (!isOpen) {
          window.setTimeout(() => {
            servicesSection.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }, 80);
        }
      });

      const qrImage = "qr-rocio-estrella.png";
      qrCode.src = qrImage;
      downloadQr.href = qrImage;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => {
          toast.classList.remove("is-visible");
        }, 2200);
      }

      function downloadFile(filename, content, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 500);
      }

      function createVCard() {
        return [
          "BEGIN:VCARD",
          "VERSION:3.0",
          "N:Estrella;Rocío;;;",
          "FN:Rocío Estrella",
          "TITLE:Asistente Virtual",
          `TEL;TYPE=CELL:${profile.phone}`,
          `EMAIL;TYPE=INTERNET:${profile.email}`,
          `URL:${cardUrl}`,
          "END:VCARD",
        ].join("\r\n");
      }

      document.querySelector("#save-contact").addEventListener("click", () => {
        downloadFile("rocio-estrella.vcf", createVCard(), "text/vcard;charset=utf-8");
        showToast("Contacto listo para guardar");
      });

      document.querySelector("#share-card").addEventListener("click", async () => {
        const shareData = {
          title: `${profile.name} · ${profile.role}`,
          text: profile.bio,
          url: cardUrl,
        };

        try {
          if (navigator.share) {
            await navigator.share(shareData);
            return;
          }

          await navigator.clipboard.writeText(cardUrl);
          showToast("Enlace copiado");
        } catch (error) {
          if (error.name !== "AbortError") {
            showToast("No se pudo compartir");
          }
        }
      });
    </script>
  </body>
</html>
